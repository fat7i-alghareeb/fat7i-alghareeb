<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
  <title id="t">Fathi Al-Ghareeb: Flutter and Full-Stack Developer</title>
  <desc id="d">I ship Flutter apps, and the backends behind them when it counts. Based in Aleppo, Syria, working remotely worldwide.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17130f"/>
      <stop offset="1" stop-color="#0e0c0a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8b04b" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#e8b04b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3c469"/>
      <stop offset="1" stop-color="#c98d24"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fdfaf4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fdfaf4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fdfaf4" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="420" rx="28"/></clipPath>
    <clipPath id="mono"><path d="M150 142L171 102H392L371 142H202V177H374L353 216H202V313H150V142Z M282 216H353L247 410H193L282 216Z"/></clipPath>
    <style>
      .sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
      .mono{font-family:ui-monospace,'SFMono-Regular','Cascadia Code',Consolas,'Liberation Mono',monospace}
      .rise{opacity:0;animation:rise .9s cubic-bezier(.22,1,.36,1) forwards}
      .d1{animation-delay:.15s}.d2{animation-delay:.35s}.d3{animation-delay:.55s}.d4{animation-delay:.75s}.d5{animation-delay:.95s}
      @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
      .pulse{animation:pulse 2s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
      @keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:0;transform:scale(2.6)}}
      .float{animation:float 6s ease-in-out infinite}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
      .flow{stroke-dasharray:6 8;animation:flow 1.2s linear infinite}
      .flow-r{stroke-dasharray:6 8;animation:flow 1.2s linear infinite reverse}
      @keyframes flow{to{stroke-dashoffset:-28}}
      .blink{animation:blink 1.6s steps(2,start) infinite}
      @keyframes blink{to{visibility:hidden}}
      .led{animation:led 1.4s ease-in-out infinite}
      .led2{animation:led 1.4s ease-in-out .45s infinite}
      .led3{animation:led 1.4s ease-in-out .9s infinite}
      @keyframes led{0%,100%{opacity:1}50%{opacity:.25}}
      .sweep{animation:sweep 4.5s ease-in-out 1.2s infinite}
      @keyframes sweep{0%{transform:translateX(-260px)}45%,100%{transform:translateX(560px)}}
      .orbit{animation:orbit 14s linear infinite;transform-origin:150px 205px}
      @keyframes orbit{to{transform:rotate(360deg)}}
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="420" fill="url(#bg)"/>
    <rect width="1280" height="420" fill="url(#grid)"/>
    <circle cx="150" cy="205" r="260" fill="url(#glow)"/>
    <circle cx="1090" cy="210" r="240" fill="url(#glow)" opacity="0.55"/>

    <!-- network backdrop -->
    <g stroke="#e8b04b" stroke-opacity="0.12" fill="none">
      <path d="M640 30L760 90L880 40L990 110M760 90L720 180M880 40L930 0M990 110L1080 60L1200 100L1280 70M1200 100L1240 170"/>
      <path d="M560 400L650 350L760 390L840 330M650 350L610 300M1120 380L1200 340L1280 370"/>
    </g>
    <g fill="#e8b04b" fill-opacity="0.35">
      <circle cx="760" cy="90" r="2.5"/><circle cx="880" cy="40" r="2.5"/><circle cx="990" cy="110" r="2.5"/>
      <circle cx="1080" cy="60" r="2.5"/><circle cx="1200" cy="100" r="2.5"/><circle cx="650" cy="350" r="2.5"/>
      <circle cx="760" cy="390" r="2.5"/><circle cx="1200" cy="340" r="2.5"/>
    </g>

    <!-- F7 monogram -->
    <g class="float">
      <g class="orbit">
        <circle cx="150" cy="205" r="122" fill="none" stroke="#e8b04b" stroke-opacity="0.22" stroke-dasharray="2 10"/>
        <circle cx="272" cy="205" r="4" fill="#f3c469"/>
        <circle cx="28" cy="205" r="2.5" fill="#f3c469" fill-opacity="0.6"/>
      </g>
      <circle cx="150" cy="205" r="96" fill="#1f1a14" stroke="#e8b04b" stroke-opacity="0.35"/>
      <g transform="translate(150 205) scale(0.46) translate(-271 -256)">
        <path d="M150 142L171 102H392L371 142H202V177H374L353 216H202V313H150V142Z" fill="url(#gold)"/>
        <path d="M282 216H353L247 410H193L282 216Z" fill="url(#gold)"/>
        <g clip-path="url(#mono)"><rect class="sweep" x="0" y="80" width="120" height="360" fill="url(#shine)" transform="skewX(-20)"/></g>
      </g>
    </g>

    <!-- copy -->
    <g class="sans">
      <g class="rise d1">
        <text x="300" y="112" class="mono" font-size="15" letter-spacing="4" fill="#e8b04b">FATHI AL-GHAREEB · فتحي الغريب</text>
      </g>
      <g class="rise d2">
        <text x="298" y="172" font-size="42" font-weight="700" fill="#fdfaf4" letter-spacing="-1">I ship Flutter apps <tspan fill="#e8b04b">—</tspan></text>
      </g>
      <g class="rise d3">
        <text x="298" y="224" font-size="42" font-weight="700" fill="#e8b04b" letter-spacing="-1">and the backends behind them.</text>
      </g>
      <g class="rise d4">
        <text x="300" y="268" font-size="18" fill="#a99e8e">Flutter &amp; Full-Stack Developer · Clean Architecture · Real-time systems</text>
      </g>
      <g class="rise d5">
        <rect x="300" y="304" width="262" height="40" rx="20" fill="#7ddf9a" fill-opacity="0.08" stroke="#7ddf9a" stroke-opacity="0.35"/>
        <circle cx="324" cy="324" r="5" fill="#7ddf9a"/>
        <circle class="pulse" cx="324" cy="324" r="5" fill="#7ddf9a"/>
        <text x="340" y="330" font-size="16" fill="#efe9e1">Open to remote work</text>
        <rect x="576" y="304" width="210" height="40" rx="20" fill="#e8b04b" fill-opacity="0.08" stroke="#e8b04b" stroke-opacity="0.35"/>
        <path d="M602 314a8 8 0 0 0-8 8c0 6 8 13 8 13s8-7 8-13a8 8 0 0 0-8-8zm0 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6z" fill="#e8b04b"/>
        <text x="618" y="330" font-size="16" fill="#efe9e1">Aleppo, Syria</text>
      </g>
    </g>

    <!-- client ⇄ server illustration -->
    <g class="float" style="animation-delay:-3s">
      <!-- phone -->
      <rect x="912" y="86" width="124" height="240" rx="22" fill="#141009" stroke="#e8b04b" stroke-opacity="0.55" stroke-width="2"/>
      <rect x="950" y="96" width="48" height="8" rx="4" fill="#2a231b"/>
      <rect x="926" y="118" width="96" height="30" rx="8" fill="#e8b04b" fill-opacity="0.85"/>
      <rect x="926" y="158" width="96" height="44" rx="8" fill="#1f1a14" stroke="#ffffff" stroke-opacity="0.08"/>
      <rect x="934" y="168" width="44" height="6" rx="3" fill="#efe9e1" fill-opacity="0.55"/>
      <rect x="934" y="182" width="66" height="6" rx="3" fill="#a99e8e" fill-opacity="0.45"/>
      <rect x="926" y="210" width="96" height="44" rx="8" fill="#1f1a14" stroke="#ffffff" stroke-opacity="0.08"/>
      <rect x="934" y="220" width="56" height="6" rx="3" fill="#efe9e1" fill-opacity="0.55"/>
      <rect x="934" y="234" width="40" height="6" rx="3" fill="#a99e8e" fill-opacity="0.45"/>
      <rect x="926" y="262" width="96" height="44" rx="8" fill="#1f1a14" stroke="#ffffff" stroke-opacity="0.08"/>
      <rect x="934" y="272" width="62" height="6" rx="3" fill="#efe9e1" fill-opacity="0.55"/>
      <rect x="934" y="286" width="30" height="6" rx="3" fill="#a99e8e" fill-opacity="0.45"/>
      <text x="974" y="352" text-anchor="middle" class="mono" font-size="13" fill="#a99e8e">Flutter</text>

      <!-- wires -->
      <path d="M1040 180H1128" stroke="#e8b04b" stroke-width="2" class="flow" fill="none"/>
      <path d="M1040 236H1128" stroke="#7ddf9a" stroke-width="2" class="flow-r" fill="none"/>
      <text x="1084" y="170" text-anchor="middle" class="mono" font-size="11" fill="#e8b04b">REST</text>
      <text x="1084" y="258" text-anchor="middle" class="mono" font-size="11" fill="#7ddf9a">SignalR</text>

      <!-- server stack -->
      <g>
        <rect x="1132" y="120" width="116" height="52" rx="10" fill="#17130f" stroke="#e8b04b" stroke-opacity="0.45" stroke-width="2"/>
        <rect x="1132" y="182" width="116" height="52" rx="10" fill="#17130f" stroke="#e8b04b" stroke-opacity="0.45" stroke-width="2"/>
        <rect x="1132" y="244" width="116" height="52" rx="10" fill="#17130f" stroke="#e8b04b" stroke-opacity="0.45" stroke-width="2"/>
        <circle class="led" cx="1150" cy="146" r="4.5" fill="#7ddf9a"/>
        <circle class="led2" cx="1150" cy="208" r="4.5" fill="#7ddf9a"/>
        <circle class="led3" cx="1150" cy="270" r="4.5" fill="#e8b04b"/>
        <rect x="1166" y="142" width="64" height="7" rx="3.5" fill="#2a231b"/>
        <rect x="1166" y="204" width="64" height="7" rx="3.5" fill="#2a231b"/>
        <rect x="1166" y="266" width="64" height="7" rx="3.5" fill="#2a231b"/>
      </g>
      <text x="1190" y="322" text-anchor="middle" class="mono" font-size="13" fill="#a99e8e">.NET API</text>
    </g>

    <!-- prompt line -->
    <g class="mono" font-size="13">
      <text x="300" y="388" fill="#756c5f">~/fat7i <tspan fill="#e8b04b">$</tspan> <tspan fill="#a99e8e">flutter build --release &amp;&amp; dotnet publish</tspan></text>
      <rect class="blink" x="706" y="377" width="8" height="14" fill="#e8b04b"/>
    </g>

    <rect x="0.5" y="0.5" width="1279" height="419" rx="27.5" fill="none" stroke="#e8b04b" stroke-opacity="0.22"/>
  </g>
</svg>
