<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="24" viewBox="0 0 1280 24" aria-hidden="true">
  <defs>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8b04b" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e8b04b" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#e8b04b" stop-opacity="0"/>
    </linearGradient>
    <style>
      .spark{animation:run 5s ease-in-out infinite}
      @keyframes run{0%{transform:translateX(-200px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(1480px);opacity:0}}
    </style>
  </defs>
  <rect x="140" y="11.5" width="1000" height="1" fill="url(#l)"/>
  <circle class="spark" cx="0" cy="12" r="2.5" fill="#f3c469"/>
  <g transform="translate(640 12) rotate(45)">
    <rect x="-6" y="-6" width="12" height="12" fill="#0e0c0a" stroke="#e8b04b" stroke-width="1.5"/>
    <rect x="-2.5" y="-2.5" width="5" height="5" fill="#e8b04b"/>
  </g>
  <circle cx="600" cy="12" r="2" fill="#e8b04b" fill-opacity="0.7"/>
  <circle cx="680" cy="12" r="2" fill="#e8b04b" fill-opacity="0.7"/>
</svg>
