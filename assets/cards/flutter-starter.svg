<svg xmlns="http://www.w3.org/2000/svg" width="620" height="340" viewBox="0 0 620 340" role="img" aria-labelledby="t d">
  <title id="t">Flutter Starter Template</title>
  <desc id="d">One command to a production-ready Flutter app. Clean Architecture: core · features · common. go_router splash / onboarding / auth flow. Stage + Production flavors · easy_localization. injectable · freezed · local + FCM notifications. Built with Flutter, Mason, injectable, freezed.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c1712"/><stop offset="1" stop-color="#0e0c0a"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#54c5f8" stop-opacity="0.22"/><stop offset="1" stop-color="#54c5f8" stop-opacity="0"/></radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <clipPath id="clip"><rect width="620" height="340" rx="22"/></clipPath>
    <style>.sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.mono{font-family:ui-monospace,'SFMono-Regular','Cascadia Code',Consolas,monospace}
.rise{opacity:0;animation:rise .8s cubic-bezier(.22,1,.36,1) forwards}
.r2{animation-delay:.12s}.r3{animation-delay:.24s}.r4{animation-delay:.36s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.sweep{animation:sweep 5s ease-in-out 1s infinite}
@keyframes sweep{0%{transform:translateX(-200px)}40%,100%{transform:translateX(820px)}}
.float{animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}</style>
  </defs>
  <g clip-path="url(#clip)" class="sans">
    <rect width="620" height="340" fill="url(#bg)"/>
    <circle cx="560" cy="40" r="170" fill="url(#glow)"/>
    <rect class="sweep" x="0" y="-40" width="160" height="420" fill="url(#shine)" transform="skewX(-18)"/>
    <rect x="0" y="0" width="620" height="4" fill="#54c5f8" fill-opacity="0.85"/>
    <g class="float"><g transform="translate(548 70)" fill="none" stroke="#54c5f8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle r="34" fill="#54c5f8" fill-opacity="0.08" stroke-opacity="0.35"/><rect x="-18" y="-14" width="16" height="10" rx="2"/><rect x="2" y="-14" width="16" height="10" rx="2"/><rect x="-10" y="0" width="20" height="10" rx="2"/><rect x="-18" y="14" width="16" height="0.5"/></g></g>
    <g class="rise">
      <text x="32" y="48" class="mono" font-size="12" letter-spacing="2.5" fill="#54c5f8">MASON BRICK</text>
      <text x="32" y="88" font-size="28" font-weight="700" fill="#fdfaf4" letter-spacing="-0.5">Flutter Starter Template</text>
      <text x="32" y="116" font-size="15" fill="#a99e8e">One command to a production-ready Flutter app</text>
    </g>
    <g class="rise r2"><rect x="32" y="151" width="8" height="8" rx="2" transform="rotate(45 36 155)" fill="#54c5f8"/><text x="52" y="160" font-size="14.5" fill="#efe9e1">Clean Architecture: core · features · common</text></g><g class="rise r3"><rect x="32" y="179" width="8" height="8" rx="2" transform="rotate(45 36 183)" fill="#54c5f8"/><text x="52" y="188" font-size="14.5" fill="#efe9e1">go_router splash / onboarding / auth flow</text></g><g class="rise r4"><rect x="32" y="207" width="8" height="8" rx="2" transform="rotate(45 36 211)" fill="#54c5f8"/><text x="52" y="216" font-size="14.5" fill="#efe9e1">Stage + Production flavors · easy_localization</text></g><g class="rise r4"><rect x="32" y="235" width="8" height="8" rx="2" transform="rotate(45 36 239)" fill="#54c5f8"/><text x="52" y="244" font-size="14.5" fill="#efe9e1">injectable · freezed · local + FCM notifications</text></g>
    <g class="rise r4"><rect x="32" y="286" width="79" height="28" rx="14" fill="#54c5f8" fill-opacity="0.1" stroke="#54c5f8" stroke-opacity="0.4"/><text x="71.5" y="304.5" text-anchor="middle" class="mono" font-size="12" fill="#54c5f8">Flutter</text><rect x="119" y="286" width="64" height="28" rx="14" fill="#54c5f8" fill-opacity="0.1" stroke="#54c5f8" stroke-opacity="0.4"/><text x="151.0" y="304.5" text-anchor="middle" class="mono" font-size="12" fill="#54c5f8">Mason</text><rect x="191" y="286" width="102" height="28" rx="14" fill="#54c5f8" fill-opacity="0.1" stroke="#54c5f8" stroke-opacity="0.4"/><text x="242.0" y="304.5" text-anchor="middle" class="mono" font-size="12" fill="#54c5f8">injectable</text><rect x="301" y="286" width="79" height="28" rx="14" fill="#54c5f8" fill-opacity="0.1" stroke="#54c5f8" stroke-opacity="0.4"/><text x="340.5" y="304.5" text-anchor="middle" class="mono" font-size="12" fill="#54c5f8">freezed</text></g>
    <g class="rise r4"><circle cx="510" cy="300" r="6" fill="#00B4AB"/><text x="522" y="305" font-size="13" fill="#a99e8e">Dart</text></g>
  </g>
  <rect x="0.5" y="0.5" width="619" height="339" rx="21.5" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>
</svg>
