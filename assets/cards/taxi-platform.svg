<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">Fat7i Taxi: a complete ride-hailing platform</title>
  <desc id="d">Three open-source repositories: a Flutter rider app, a .NET 10 Taxi API, and a Flutter driver and admin app. They talk over REST and SignalR. Features include Stripe payments with a wallet, live SignalR dispatch, nine languages including Arabic, OTP authentication and CI-enforced Clean Architecture.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1712"/>
      <stop offset="1" stop-color="#0e0c0a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8b04b" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#e8b04b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="clip"><rect width="1280" height="400" rx="26"/></clipPath>
    <style>
      .sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
      .mono{font-family:ui-monospace,'SFMono-Regular','Cascadia Code',Consolas,monospace}
      .nt{font-size:18px;font-weight:600;fill:#fdfaf4}
      .ns{font-size:13px;fill:#a99e8e}
      .rp{font-size:12px;fill:#e8b04b}
      .flow{stroke-dasharray:5 7;animation:flow 1.1s linear infinite}
      .flow-r{stroke-dasharray:5 7;animation:flow 1.1s linear infinite reverse}
      @keyframes flow{to{stroke-dashoffset:-24}}
      .led{animation:led 1.3s ease-in-out infinite}
      @keyframes led{0%,100%{opacity:1}50%{opacity:.25}}
      .ping{animation:ping 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
      @keyframes ping{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(3)}}
      .rise{opacity:0;animation:rise .8s cubic-bezier(.22,1,.36,1) forwards}
      .r2{animation-delay:.15s}.r3{animation-delay:.3s}.r4{animation-delay:.45s}
      @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    </style>
  </defs>

  <g clip-path="url(#clip)" class="sans">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <rect width="1280" height="400" fill="url(#grid)"/>
    <circle cx="640" cy="230" r="300" fill="url(#glow)"/>
    <rect width="1280" height="4" fill="#e8b04b"/>

    <!-- route with moving car -->
    <path id="route" d="M780 92C860 30 930 120 1010 70S1150 20 1240 72" fill="none" stroke="#e8b04b" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 9"/>
    <circle cx="780" cy="92" r="6" fill="#7ddf9a"/>
    <circle class="ping" cx="780" cy="92" r="6" fill="none" stroke="#7ddf9a" stroke-width="2"/>
    <path d="M1240 58a10 10 0 0 0-10 10c0 8 10 16 10 16s10-8 10-16a10 10 0 0 0-10-10z" fill="#e8b04b"/>
    <circle cx="1240" cy="68" r="3.5" fill="#1c1712"/>
    <g>
      <rect x="-11" y="-7" width="22" height="14" rx="5" fill="#f3c469"/>
      <rect x="-5" y="-5" width="9" height="10" rx="2" fill="#1c1712" fill-opacity="0.7"/>
      <animateMotion dur="6s" repeatCount="indefinite" rotate="auto" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
        <mpath href="#route"/>
      </animateMotion>
    </g>

    <!-- heading -->
    <g class="rise">
      <text x="56" y="62" class="mono" font-size="12.5" letter-spacing="2.5" fill="#e8b04b">FLAGSHIP · 3 OPEN-SOURCE REPOS · ONE PLATFORM</text>
      <text x="54" y="106" font-size="34" font-weight="700" fill="#fdfaf4" letter-spacing="-0.5">Fat7i Taxi <tspan fill="#e8b04b">—</tspan> ride-hailing, end to end</text>
      <text x="56" y="136" font-size="15.5" fill="#a99e8e">Book, dispatch, track live, pay. Two Flutter apps and the .NET API behind them.</text>
    </g>

    <!-- node: rider -->
    <g class="rise r2">
      <rect x="56" y="170" width="300" height="134" rx="18" fill="#17130f" stroke="#e8b04b" stroke-opacity="0.35"/>
      <rect x="78" y="192" width="44" height="74" rx="10" fill="none" stroke="#54c5f8" stroke-width="2"/>
      <rect x="86" y="204" width="28" height="8" rx="3" fill="#54c5f8" fill-opacity="0.8"/>
      <rect x="86" y="218" width="28" height="5" rx="2.5" fill="#efe9e1" fill-opacity="0.4"/>
      <rect x="86" y="228" width="20" height="5" rx="2.5" fill="#efe9e1" fill-opacity="0.3"/>
      <circle cx="100" cy="252" r="5" fill="#54c5f8" fill-opacity="0.8"/>
      <text x="140" y="210" class="nt">Rider app</text>
      <text x="140" y="232" class="ns">Flutter · BLoC · Stripe</text>
      <text x="140" y="252" class="ns">TLS pinning · 9 languages</text>
      <text x="78" y="288" class="mono rp">customer_taxi_app</text>
    </g>

    <!-- node: api -->
    <g class="rise r3">
      <rect x="490" y="170" width="300" height="134" rx="18" fill="#1d1812" stroke="#e8b04b" stroke-opacity="0.6" stroke-width="1.5"/>
      <rect x="512" y="192" width="48" height="20" rx="5" fill="none" stroke="#a78bfa" stroke-width="2"/>
      <rect x="512" y="218" width="48" height="20" rx="5" fill="none" stroke="#a78bfa" stroke-width="2"/>
      <rect x="512" y="244" width="48" height="20" rx="5" fill="none" stroke="#a78bfa" stroke-width="2"/>
      <circle class="led" cx="522" cy="202" r="3" fill="#7ddf9a"/>
      <circle class="led" cx="522" cy="228" r="3" fill="#7ddf9a" style="animation-delay:.4s"/>
      <circle class="led" cx="522" cy="254" r="3" fill="#e8b04b" style="animation-delay:.8s"/>
      <text x="578" y="210" class="nt">Taxi API</text>
      <text x="578" y="232" class="ns">.NET 10 · CQRS · PostgreSQL</text>
      <text x="578" y="252" class="ns">Stripe · wallet · QuestPDF</text>
      <text x="512" y="288" class="mono rp">taxi_system_backend</text>
    </g>

    <!-- node: driver/admin -->
    <g class="rise r4">
      <rect x="924" y="170" width="300" height="134" rx="18" fill="#17130f" stroke="#e8b04b" stroke-opacity="0.35"/>
      <rect x="946" y="192" width="44" height="74" rx="10" fill="none" stroke="#7ddf9a" stroke-width="2"/>
      <path d="M954 238l8-16 8 10 6-6 6 12" fill="none" stroke="#7ddf9a" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="968" cy="252" r="4" fill="#7ddf9a"/>
      <text x="1008" y="210" class="nt">Driver &amp; Admin app</text>
      <text x="1008" y="232" class="ns">One app, two roles</text>
      <text x="1008" y="252" class="ns">Live fleet map · dispatch</text>
      <text x="946" y="288" class="mono rp">dashboard_taxi_app</text>
    </g>

    <!-- wires -->
    <g fill="none" stroke-width="2">
      <path d="M358 214H488" stroke="#e8b04b" class="flow"/>
      <path d="M358 258H488" stroke="#7ddf9a" class="flow-r"/>
      <path d="M792 214H922" stroke="#e8b04b" class="flow-r"/>
      <path d="M792 258H922" stroke="#7ddf9a" class="flow"/>
    </g>
    <g class="mono" font-size="11" text-anchor="middle">
      <text x="423" y="204" fill="#e8b04b">REST</text>
      <text x="423" y="278" fill="#7ddf9a">SignalR</text>
      <text x="857" y="204" fill="#e8b04b">REST</text>
      <text x="857" y="278" fill="#7ddf9a">SignalR</text>
    </g>

    <!-- feature chips -->
    <g class="mono" font-size="12.5" fill="#efe9e1">
      <rect x="56" y="332" width="200" height="34" rx="17" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="156" y="354" text-anchor="middle">Stripe + wallet</text>
      <rect x="266" y="332" width="218" height="34" rx="17" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="375" y="354" text-anchor="middle">Live SignalR dispatch</text>
      <rect x="494" y="332" width="224" height="34" rx="17" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="606" y="354" text-anchor="middle">OTP · SMS / email / Google</text>
      <rect x="728" y="332" width="204" height="34" rx="17" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="830" y="354" text-anchor="middle">9 languages · RTL</text>
      <rect x="942" y="332" width="282" height="34" rx="17" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="1083" y="354" text-anchor="middle">CI-enforced Clean Architecture</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="399" rx="25.5" fill="none" stroke="#e8b04b" stroke-opacity="0.25"/>
</svg>
