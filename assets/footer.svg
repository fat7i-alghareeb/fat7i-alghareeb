<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="220" viewBox="0 0 1280 220" role="img" aria-labelledby="t">
  <title id="t">Thanks for stopping by. Let's build something that ships.</title>
  <defs>
    <linearGradient id="w1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8b04b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e8b04b" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c98d24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1a1206" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3c469"/>
      <stop offset="1" stop-color="#c98d24"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1280" height="220" rx="26"/></clipPath>
    <style>
      .sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
      .wa{animation:wave 9s linear infinite}
      .wb{animation:wave 6s linear infinite reverse}
      @keyframes wave{to{transform:translateX(-640px)}}
      .rise{opacity:0;animation:rise 1s cubic-bezier(.22,1,.36,1) .2s forwards}
      @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1280" height="220" fill="#0e0c0a"/>
    <g class="wa">
      <path d="M0 178Q160 150 320 178T640 178T960 178T1280 178T1600 178T1920 178V220H0Z" fill="url(#w1)"/>
    </g>
    <g class="wb">
      <path d="M0 198Q160 180 320 198T640 198T960 198T1280 198T1600 198T1920 198V220H0Z" fill="url(#w2)"/>
    </g>
    <g class="rise sans" text-anchor="middle">
      <g transform="translate(640 46) scale(0.11) translate(-271 -256)">
        <path d="M150 142L171 102H392L371 142H202V177H374L353 216H202V313H150V142Z" fill="url(#gold)"/>
        <path d="M282 216H353L247 410H193L282 216Z" fill="url(#gold)"/>
      </g>
      <text x="640" y="104" font-size="26" font-weight="700" fill="#fdfaf4">Thanks for stopping by.</text>
      <text x="640" y="132" font-size="16" fill="#a99e8e">Let's build something that ships.</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="219" rx="25.5" fill="none" stroke="#e8b04b" stroke-opacity="0.2"/>
</svg>
