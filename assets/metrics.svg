<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="190" viewBox="0 0 1280 190" role="img" aria-labelledby="t d">
  <title id="t">Proof, not adjectives</title>
  <desc id="d">3+ years building Flutter. 5 production apps shipped at Elkood. 2,000+ active users reached. 285 REST endpoints in one backend. 90% performance gain on a legacy rebuild. Crash rate cut by up to 30%.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f1a14"/>
      <stop offset="1" stop-color="#141009"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8b04b" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f3c469"/>
      <stop offset="1" stop-color="#e8b04b" stop-opacity="0"/>
    </linearGradient>
    <style>
      .sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
      .mono{font-family:ui-monospace,'SFMono-Regular','Cascadia Code',Consolas,monospace}
      .c{opacity:0;animation:in .8s cubic-bezier(.22,1,.36,1) forwards}
      .c1{animation-delay:.05s}.c2{animation-delay:.2s}.c3{animation-delay:.35s}.c4{animation-delay:.5s}.c5{animation-delay:.65s}.c6{animation-delay:.8s}
      @keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
      .glint{animation:glint 6s ease-in-out infinite}
      @keyframes glint{0%,100%{opacity:.25}50%{opacity:1}}
      .num{font-size:46px;font-weight:700;fill:#e8b04b;letter-spacing:-1px}
      .lbl{font-size:16px;font-weight:600;fill:#fdfaf4}
      .det{font-size:12.5px;fill:#a99e8e}
    </style>
  </defs>

  <g class="sans">
    <g class="c c1">
      <rect x="1" y="1" width="198" height="186" rx="18" fill="url(#card)" stroke="#e8b04b" stroke-opacity="0.22"/>
      <rect class="glint" x="30" y="1" width="140" height="2" fill="url(#bar)"/>
      <text x="24" y="70" class="num">3+</text>
      <text x="24" y="112" class="lbl">Years of Flutter</text>
      <text x="24" y="140" class="det">Production mobile &amp;</text>
      <text x="24" y="158" class="det">desktop since 2023</text>
    </g>
    <g transform="translate(216 0)"><g class="c c2">
      <rect x="1" y="1" width="198" height="186" rx="18" fill="url(#card)" stroke="#e8b04b" stroke-opacity="0.22"/>
      <rect class="glint" x="30" y="1" width="140" height="2" fill="url(#bar)" style="animation-delay:1s"/>
      <text x="24" y="70" class="num">5</text>
      <text x="24" y="112" class="lbl">Apps shipped</text>
      <text x="24" y="140" class="det">at Elkood in 14 months:</text>
      <text x="24" y="158" class="det">e-learning to logistics</text>
    </g></g>
    <g transform="translate(432 0)"><g class="c c3">
      <rect x="1" y="1" width="198" height="186" rx="18" fill="url(#card)" stroke="#e8b04b" stroke-opacity="0.22"/>
      <rect class="glint" x="30" y="1" width="140" height="2" fill="url(#bar)" style="animation-delay:2s"/>
      <text x="24" y="70" class="num">2,000+</text>
      <text x="24" y="112" class="lbl">Active users</text>
      <text x="24" y="140" class="det">served by 12+ features</text>
      <text x="24" y="158" class="det">I shipped to production</text>
    </g></g>
    <g transform="translate(648 0)"><g class="c c4">
      <rect x="1" y="1" width="198" height="186" rx="18" fill="url(#card)" stroke="#e8b04b" stroke-opacity="0.22"/>
      <rect class="glint" x="30" y="1" width="140" height="2" fill="url(#bar)" style="animation-delay:3s"/>
      <text x="24" y="70" class="num">285</text>
      <text x="24" y="112" class="lbl">REST endpoints</text>
      <text x="24" y="140" class="det">60k-request load test,</text>
      <text x="24" y="158" class="det">zero server errors</text>
    </g></g>
    <g transform="translate(864 0)"><g class="c c5">
      <rect x="1" y="1" width="198" height="186" rx="18" fill="url(#card)" stroke="#e8b04b" stroke-opacity="0.22"/>
      <rect class="glint" x="30" y="1" width="140" height="2" fill="url(#bar)" style="animation-delay:4s"/>
      <text x="24" y="70" class="num">90%</text>
      <text x="24" y="112" class="lbl">Faster app</text>
      <text x="24" y="140" class="det">legacy rebuild with</text>
      <text x="24" y="158" class="det">~60% less memory</text>
    </g></g>
    <g transform="translate(1080 0)"><g class="c c6">
      <rect x="1" y="1" width="198" height="186" rx="18" fill="url(#card)" stroke="#e8b04b" stroke-opacity="0.22"/>
      <rect class="glint" x="30" y="1" width="140" height="2" fill="url(#bar)" style="animation-delay:5s"/>
      <text x="24" y="70" class="num">−30%</text>
      <text x="24" y="112" class="lbl">Crash rate</text>
      <text x="24" y="140" class="det">through refactoring &amp;</text>
      <text x="24" y="158" class="det">production hardening</text>
    </g></g>
  </g>
</svg>
